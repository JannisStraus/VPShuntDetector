name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / python${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      # Needed by the requirements.txt commit step below.
      contents: write
    env:
      # Every uv call picks this up, so no --python flag is needed anywhere.
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Narrower than the default glob, which also watches requirements.txt
          # and would be invalidated by this workflow's own commits.
          cache-dependency-glob: uv.lock

      - name: Cache model weights and test images
        uses: actions/cache@v6
        with:
          # weights.zip is ~630 MB; without this every run re-downloads it.
          path: ~/.cache/VPShuntDetector
          key: vpshunt-data-${{ runner.os }}-${{ hashFiles('vpshunt_detector/models.json') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest with coverage
        run: uv run pytest

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          uv run vpshuntdetector -h
          uv run vpshuntdetector -v

      - name: Run pre-commit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: uv run pre-commit run -a --show-diff-on-failure

      - name: Export requirements.txt
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          uv export \
            --format requirements.txt \
            --locked \
            --no-emit-local \
            --no-hashes \
            --output-file requirements.txt

      - name: Commit updated requirements.txt
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements.txt; then
            echo "requirements.txt is up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: update requirements.txt"
          git push origin HEAD:main

      - name: Send coverage results
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
